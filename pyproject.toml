# Quality gates for the workstation half. The phone half is Java and is not covered here.
# Settings follow "Agent Coding Standards - Python" in the vault.
[project]
name = "deskcam-frontend"
version = "0.1.0"
description = "Workstation console and CLI for the DeskCam bench camera"
requires-python = ">=3.11"
dependencies = ["segno", "pillow"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["frontend"]
