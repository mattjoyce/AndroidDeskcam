# Quality gates for the workstation half. The phone half is Java and is not covered here.
# ruff, mypy and bandit settings, as run by frontend/check.sh.
[project]
name = "deskcam-frontend"
version = "0.1.0"
description = "Measurement tools for the DeskCam bench camera"
requires-python = ">=3.11"
dependencies = []          # the binary needs no runtime; measuring needs [analysis]

[project.optional-dependencies]
# Measuring what is in a picture needs array maths; taking one does not. Kept out of the
# base install so the binary stays free of it, and so the boundary between
# transport and measurement is visible in the packaging as well as in the code.
analysis = ["numpy>=1.24", "pillow>=10"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
# Off by default: the workstation code is small enough to be honest about its types.
ignore_missing_imports = false

[[tool.mypy.overrides]]
# numpy and pillow ship stubs; these do not.
module = ["PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["frontend"]
